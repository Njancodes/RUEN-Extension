<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Input → Function → Output</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="card">
    <h1>Enter or Generate Key</h1>

    <label for="userInput" class="label">
      <section class="output-area" aria-live="polite">
        <strong>Enter Key</strong>
      </section>
    </label>
    <input id="userInput" class="input" type="text" placeholder="Key Here" />

    <div class="controls">
      <button id="runBtn" class="btn">Submit</button>
      <button id="clearBtn" class="btn ghost">Clear</button>
    </div>
    <section class="output-area" aria-live="polite">
      <strong>Generate</strong>
    </section>
    <button id="generateKey" class="btn generate">Generate Key</button>
        <section class="output-area" aria-live="polite">
    </section>
    <strong>List of numbers and keys</strong>
    <ul id="number-key-list"></ul>
    <p class="error">
    </p>
    <button id="decrypt" class="btn generate">Decrypt All Messages</button>
    <pre id="output" class="output">
      
    </pre>

  </main>

  <script src="popup.js"></script>
</body>

</html>
